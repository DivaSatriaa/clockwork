<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f58"/>
      <stop offset="1" stop-color="#1f2233"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6c66b"/>
      <stop offset="1" stop-color="#d98a2b"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- gear -->
  <g transform="translate(64 64)" fill="url(#brass)">
    <g id="tooth">
      <rect x="-7" y="-46" width="14" height="14" rx="3"/>
    </g>
    <use href="#tooth" transform="rotate(45)"/>
    <use href="#tooth" transform="rotate(90)"/>
    <use href="#tooth" transform="rotate(135)"/>
    <use href="#tooth" transform="rotate(180)"/>
    <use href="#tooth" transform="rotate(225)"/>
    <use href="#tooth" transform="rotate(270)"/>
    <use href="#tooth" transform="rotate(315)"/>
    <circle r="36"/>
    <circle r="28" fill="#1f2233"/>
  </g>
  <!-- waveform -->
  <path d="M42 64 h6 l4 -10 l6 22 l6 -30 l6 34 l6 -24 l4 8 h6"
        fill="none" stroke="#f6c66b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
